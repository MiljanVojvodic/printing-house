<h2>Administracija - prijava</h2>
<form (ngSubmit)="prijavaAdmina()">
  <table>
    <tr>
      <td>Korisničko ime:</td>
      <td>
        <input type="text" name="kor_ime" [(ngModel)]="kor_ime" required />
      </td>
    </tr>
    <tr>
      <td>Lozinka:</td>
      <td>
        <input
          type="password"
          name="lozinka"
          [(ngModel)]="lozinka"
          required
        />
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <input type="submit" value="Prijava" />
      </td>
    </tr>
  </table>
</form>
<span class="greska">{{ poruka }}</span>
