<h2>Prijava</h2>
<form (ngSubmit)="prijavaNaSistem()">
  <table>
    <tr>
      <td>Korisničko ime:</td>
      <td>
        <input type="text" name="kor_ime" [(ngModel)]="kor_ime" required />
      </td>
    </tr>
    <tr>
      <td>Lozinka:</td>
      <td>
        <input
          type="password"
          name="lozinka"
          [(ngModel)]="lozinka"
          required
        />
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <input type="submit" value="Prijava" />
      </td>
    </tr>
  </table>
</form>
<span class="greska">{{ poruka }}</span>

<p><a routerLink="/zaboravljena-lozinka">Zaboravili ste lozinku?</a></p>
<p><a routerLink="/registracija">Nemate nalog? Registrujte se</a></p>
