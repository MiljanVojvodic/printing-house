<h2>Profil štamparije</h2>

<div class="profil-grid">
  <div class="slika-blok">
    <img
      [src]="UPLOADS_URL + '/' + (korisnik.slika || 'default_profile_image.jpg')"
      alt="Profilna slika"
      class="profilna-slika"
    />
    <label>
      Promeni sliku
      <input type="file" accept="image/jpeg,image/png,image/gif" (change)="izaberiSliku($event)" />
    </label>
  </div>

  <form class="forma-profila" (ngSubmit)="sacuvajProfil()">
    <div class="polje">
      <label>Korisničko ime</label>
      <input type="text" [value]="korisnik.kor_ime" disabled />
    </div>

    <div class="polje">
      <label for="ime">Ime odgovorne osobe *</label>
      <input id="ime" type="text" name="ime" required [(ngModel)]="korisnik.ime" />
    </div>

    <div class="polje">
      <label for="prezime">Prezime odgovorne osobe *</label>
      <input id="prezime" type="text" name="prezime" required [(ngModel)]="korisnik.prezime" />
    </div>

    <div class="polje">
      <label for="telefon">Kontakt telefon</label>
      <input id="telefon" type="tel" name="telefon" [(ngModel)]="korisnik.telefon" />
    </div>

    <div class="polje">
      <label for="mejl">E-mejl *</label>
      <input id="mejl" type="email" name="mejl" required [(ngModel)]="korisnik.mejl" />
    </div>

    <div class="polje">
      <label for="nazivInstitucije">Naziv štamparije *</label>
      <input
        id="nazivInstitucije"
        type="text"
        name="nazivInstitucije"
        required
        [(ngModel)]="korisnik.nazivInstitucije"
      />
    </div>
    <div class="polje">
      <label for="adresa">Adresa sedišta *</label>
      <input id="adresa" type="text" name="adresa" required [(ngModel)]="korisnik.adresa" />
    </div>
    <div class="polje">
      <label for="grad">Grad *</label>
      <input id="grad" type="text" name="grad" required [(ngModel)]="korisnik.grad" />
    </div>

    @if (poruka) {
      <p class="greska">{{ poruka }}</p>
    }
    @if (uspesnaPoruka) {
      <p class="uspeh">{{ uspesnaPoruka }}</p>
    }

    <button type="submit" [disabled]="cuvanjeUToku">
      {{ cuvanjeUToku ? 'Čuvanje...' : 'Sačuvaj izmene' }}
    </button>
  </form>
</div>
