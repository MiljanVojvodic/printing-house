<form class="forma-pretrage" (ngSubmit)="pretrazi()">
  <div class="polje-inline">
    <label for="naziv">Naziv proizvoda</label>
    <input
      id="naziv"
      type="text"
      name="naziv"
      placeholder="npr. Hemijska olovka, Polo majica..."
      [(ngModel)]="naziv"
    />
  </div>

  <div class="polje-inline">
    <label for="kategorija">Kategorija</label>
    <select id="kategorija" name="kategorija" [(ngModel)]="kategorijaOdabrana">
      <option value="">Sve kategorije</option>
      @for (k of kategorije; track k._id) {
        <option [value]="k.naziv">{{ k.naziv }}</option>
      }
    </select>
  </div>

  <button type="submit">Pretraži</button>
</form>

@if (pretragaIzvrsena) {
  <table class="tabela-rezultata">
    <thead>
      <tr>
        <th (click)="sortiraj('naziv')" class="sortirajuca-kolona">Naziv proizvoda ⇅</th>
        <th (click)="sortiraj('kategorija')" class="sortirajuca-kolona">Kategorija ⇅</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (p of rezultati; track p._id) {
        <tr>
          <td>{{ p.naziv }}</td>
          <td>{{ p.podkategorija || p.kategorija }}</td>
          <td><a [routerLink]="['/proizvodi', p._id]">DETALJI</a></td>
        </tr>
      }
      @empty {
        <tr>
          <td colspan="3">Nema pronađenih proizvoda.</td>
        </tr>
      }
    </tbody>
  </table>
}
